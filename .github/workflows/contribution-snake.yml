name: Generate contribution snake

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/contribution-snake.yml']

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate the contribution animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: assets/github-snake.svg?palette=github-dark&color_snake=caff67
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit the refreshed snake
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: refresh contribution snake [skip ci]'
          file_pattern: assets/github-snake.svg
