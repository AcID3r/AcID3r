<svg xmlns="http://www.w3.org/2000/svg" width="900" height="225" viewBox="0 0 800 200"><rect width="800" height="200" fill="#0c0d12"/>
    <text x="24" y="32" font-family="Consolas, monospace" font-size="11" font-weight="500" fill="#7a7a7a" letter-spacing="2">[ DEVELOPER QUOTE ]</text>
    <g class="developer-quote-card">
      <rect x="12" y="44" width="776" height="144" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />

      <g transform="translate(28, 80)">
        <path d="M3 21c3 0 7-1 7-8V5c0-1.25-.75-2-2-2H4c-1.25 0-2 .75-2 2v6c0 1.25.75 2 2 2h3c-.5 4-2 6-4 6zM17 21c3 0 7-1 7-8V5c0-1.25-.75-2-2-2h-4c-1.25 0-2 .75-2 2v6c0 1.25.75 2 2 2h3c-.5 4-2 6-4 6z" fill="#c5ff4a" transform="scale(0.7)" opacity="0.85" />
      </g>

      <text font-family="Consolas, monospace" font-size="13" font-weight="500" fill="#e6edf3" font-style="italic">
        <tspan x="58" y="94">“There are only two hard things in Computer Science: cache invalidation and</tspan><tspan x="58" y="114">naming things.”</tspan>
      </text>

      <text x="768" y="152" text-anchor="end" font-family="Consolas, monospace" font-size="11" font-weight="600" fill="#8b949e" letter-spacing="0.5">
        — Phil Karlton
      </text>

      <circle cx="770" cy="62" r="3" fill="#c5ff4a" opacity="0.9" />
    </g>
  </svg>
