<svg xmlns="http://www.w3.org/2000/svg" width="420" height="840" viewBox="0 0 420 840"><rect width="420" height="840" fill="#08090d"/><g font-family="Consolas,monospace"><text x="20" y="46" font-size="25" fill="#caff67" font-weight="bold">MedoraAI</text><text x="20" y="79" font-size="14" fill="#e6edf3">Explainable clinical decision support</text><text x="20" y="110" font-size="14" fill="#b1b9c6">Multi-organ imaging across X-ray, MRI, CT</text><text x="20" y="133" font-size="14" fill="#b1b9c6">and ultrasound.</text><text x="20" y="164" font-size="14" fill="#b1b9c6">RAD-DINO attribution and Grad-CAM /</text><text x="20" y="187" font-size="14" fill="#b1b9c6">Grad-CAM++ explanations.</text><text x="20" y="218" font-size="14" fill="#70d8db">PyTorch · TensorFlow · FastAPI · React ·</text><text x="20" y="241" font-size="14" fill="#70d8db">TypeScript</text><path d="M20 278H400" stroke="#29303b"/><text x="20" y="327" font-size="25" fill="#caff67" font-weight="bold">NOVA-X</text><text x="20" y="360" font-size="14" fill="#e6edf3">Autonomous multimodal operations agent</text><text x="20" y="391" font-size="14" fill="#b1b9c6">Six specialised agents reasoning over</text><text x="20" y="414" font-size="14" fill="#b1b9c6">documents, images and video.</text><text x="20" y="445" font-size="14" fill="#b1b9c6">Vision-language reasoning with hybrid RAG</text><text x="20" y="468" font-size="14" fill="#b1b9c6">and episodic memory.</text><text x="20" y="499" font-size="14" fill="#70d8db">LangGraph · Qdrant · GPT-4V / LLaVA ·</text><text x="20" y="522" font-size="14" fill="#70d8db">Docker</text><path d="M20 559H400" stroke="#29303b"/><text x="20" y="608" font-size="25" fill="#caff67" font-weight="bold">AEGIS-R</text><text x="20" y="641" font-size="14" fill="#e6edf3">Robotics vision-language agent system</text><text x="20" y="672" font-size="14" fill="#b1b9c6">Perception, reasoning, memory, planning and</text><text x="20" y="695" font-size="14" fill="#b1b9c6">safety monitoring.</text><text x="20" y="726" font-size="14" fill="#b1b9c6">Live camera understanding with persistent</text><text x="20" y="749" font-size="14" fill="#b1b9c6">spatial semantic memory.</text><text x="20" y="780" font-size="14" fill="#70d8db">ROS2 · YOLOv8 · SAM · LangGraph · OpenCV</text><path d="M20 817H400" stroke="#29303b"/></g></svg>
